<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Thermometer tube -->
  <rect x="40" y="15" width="20" height="55" rx="10"
        fill="none"
        stroke="#3b82f6"
        stroke-width="3"/>

  <!-- Bulb -->
  <circle cx="50" cy="80" r="15"
          fill="#3b82f6"/>

  <!-- Mercury/liquid (low level for freezing) -->
  <rect x="43" y="55" width="14" height="15"
        fill="#3b82f6"/>
  <circle cx="50" cy="80" r="10"
          fill="#1e40af"/>

  <!-- Snowflake decoration -->
  <path d="M 25 25 L 25 35 M 20 30 L 30 30 M 22 27 L 28 33 M 22 33 L 28 27"
        stroke="#3b82f6"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Scale marks -->
  <line x1="60" y1="25" x2="65" y2="25" stroke="#3b82f6" stroke-width="2"/>
  <line x1="60" y1="35" x2="65" y2="35" stroke="#3b82f6" stroke-width="2"/>
  <line x1="60" y1="45" x2="65" y2="45" stroke="#3b82f6" stroke-width="2"/>
</svg>
