<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Thermometer tube -->
  <rect x="40" y="15" width="20" height="55" rx="10"
        fill="none"
        stroke="#06b6d4"
        stroke-width="3"/>

  <!-- Bulb -->
  <circle cx="50" cy="80" r="15"
          fill="#06b6d4"/>

  <!-- Mercury/liquid (medium level for cold) -->
  <rect x="43" y="40" width="14" height="30"
        fill="#06b6d4"/>
  <circle cx="50" cy="80" r="10"
          fill="#0e7490"/>

  <!-- Scale marks -->
  <line x1="60" y1="25" x2="65" y2="25" stroke="#06b6d4" stroke-width="2"/>
  <line x1="60" y1="35" x2="65" y2="35" stroke="#06b6d4" stroke-width="2"/>
  <line x1="60" y1="45" x2="65" y2="45" stroke="#06b6d4" stroke-width="2"/>
  <line x1="60" y1="55" x2="65" y2="55" stroke="#06b6d4" stroke-width="2"/>
</svg>
