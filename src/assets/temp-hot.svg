<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Thermometer tube -->
  <rect x="40" y="15" width="20" height="55" rx="10"
        fill="none"
        stroke="#ef4444"
        stroke-width="3"/>

  <!-- Bulb -->
  <circle cx="50" cy="80" r="15"
          fill="#ef4444"/>

  <!-- Mercury/liquid (high level for hot) -->
  <rect x="43" y="22" width="14" height="48"
        fill="#ef4444"/>
  <circle cx="50" cy="80" r="10"
          fill="#991b1b"/>

  <!-- Heat waves -->
  <path d="M 70 20 Q 73 23 70 26 Q 67 29 70 32"
        stroke="#ef4444"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"/>
  <path d="M 78 25 Q 81 28 78 31 Q 75 34 78 37"
        stroke="#ef4444"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"/>

  <!-- Scale marks -->
  <line x1="60" y1="25" x2="65" y2="25" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="35" x2="65" y2="35" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="45" x2="65" y2="45" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="55" x2="65" y2="55" stroke="#ef4444" stroke-width="2"/>
  <line x1="60" y1="65" x2="65" y2="65" stroke="#ef4444" stroke-width="2"/>
</svg>
